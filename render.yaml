services:
  # ── kontra-ui: the production API service (Render service name in dashboard)
  # rootDir: api keeps Render isolated from the pnpm workspace root.
  # Without rootDir, Render detects pnpm-lock.yaml and runs `pnpm install`
  # for all workspace packages (artifacts/kontra-mobile alone is several GB),
  # blowing past the 32GB ephemeral disk limit on the free tier.
  - type: web
    name: kontra-ui
    env: node
    rootDir: api
    buildCommand: "if [ -f api/package.json ]; then npm ci --prefix api --ignore-scripts --no-audit --no-fund; else npm ci --ignore-scripts --no-audit --no-fund; fi"
    startCommand: "if [ -f api/index.js ]; then node api/index.js; else node index.js; fi"
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_URL
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
      - key: EXCHANGE_ENABLED
        sync: false
      - key: DOCSIGN_API_KEY
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: LISTING_MAX_DOCS
        sync: false
      - key: MAX_OFFER_PIECES
        sync: false

  # ── kontra-api: legacy name kept in case it was created from an earlier yaml
  - type: web
    name: kontra-api
    env: node
    rootDir: api
    buildCommand: "if [ -f api/package.json ]; then npm ci --prefix api --ignore-scripts --no-audit --no-fund; else npm ci --ignore-scripts --no-audit --no-fund; fi"
    startCommand: "if [ -f api/index.js ]; then node api/index.js; else node index.js; fi"
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_URL
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
      - key: EXCHANGE_ENABLED
        sync: false
      - key: DOCSIGN_API_KEY
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: LISTING_MAX_DOCS
        sync: false
      - key: MAX_OFFER_PIECES
        sync: false
      # APP_DATABASE_URL / DATABASE_URL: leave UNSET on Render.
      # Auth and org-context use Supabase directly when no local psql URL is
      # configured. Setting this with wrong credentials causes noisy errors.
      # Only set it if you have a dedicated Postgres sidecar with correct creds.
