name: Phase 5 preparation checks

on:
  pull_request:
    branches:
      - consolidation/prep-2026-11-06
      - staging/unified-prep-2026-11-07
  push:
    branches:
      - consolidation/prep-2026-11-06
      - staging/unified-prep-2026-11-07

permissions:
  contents: read

jobs:
  phase5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            ui/package-lock.json
      - name: Pin npm
        run: |
          npm install --global npm@11.19.1
          test "$(npm --version)" = "11.19.1"
      - run: npm ci --prefix api
      - run: npm ci --prefix ui
      - name: Focused authorization and record tests
        env:
          NODE_ENV: test
          NODE_OPTIONS: --require=${{ github.workspace }}/api/testSupport/isolatedApiTestEnv.cjs --require=${{ github.workspace }}/api/testSupport/redirectAuditLogForTests.cjs
        run: |
          node --test \
            api/testSupport/isolatedApiTestEnv.node-test.cjs \
            ui/src/lib/apiBaseRouting.node-test.cjs \
            api/lib/corsSecurity.node-test.cjs \
            api/lib/spreadsheetUploadGuard.node-test.cjs \
            api/src/routes/integrationHub.node-test.cjs \
            api/lib/explicitParticipantAccess.node-test.cjs \
            api/lib/trialOwnerSessions.node-test.cjs \
            ui/src/lib/apiRequestCredentials.node-test.cjs \
            ui/src/lib/roomAccessPresentation.node-test.cjs \
            ui/src/lib/roomOwnerAccess.node-test.cjs \
            ui/src/lib/transactionRecordReview.node-test.cjs \
            ui/src/lib/verifiedAssetReadinessDisplay.node-test.cjs \
            ui/src/lib/myDealRoomsOwnerSessions.node-test.cjs \
            api/lib/stagingEnvironment.node-test.cjs \
            api/lib/stagingCors.node-test.cjs \
            ui/src/lib/supabaseConfig.test.mjs
      - name: Nodemailer recipient security tests
        env:
          NODE_ENV: test
          NODE_OPTIONS: --require=${{ github.workspace }}/api/testSupport/isolatedApiTestEnv.cjs --require=${{ github.workspace }}/api/testSupport/redirectAuditLogForTests.cjs
        run: npm --prefix api test -- --runInBand communications.security.test.js
      - name: Startup configuration tests without forced exit
        env:
          NODE_ENV: test
          NODE_OPTIONS: --require=${{ github.workspace }}/api/testSupport/isolatedApiTestEnv.cjs --require=${{ github.workspace }}/api/testSupport/redirectAuditLogForTests.cjs
        run: npm --prefix api test -- startupConfig.test.js --runInBand --detectOpenHandles --setupFilesAfterEnv="${{ github.workspace }}/api/testSupport/closeTestServers.cjs"
      - name: Complete API test suite
        continue-on-error: true
        env:
          OPENAI_API_KEY: ci-test-key-not-valid
          NODE_ENV: test
          NODE_OPTIONS: --require=${{ github.workspace }}/api/testSupport/isolatedApiTestEnv.cjs --require=${{ github.workspace }}/api/testSupport/redirectAuditLogForTests.cjs
          API_JEST_RESULT_FILE: ${{ runner.temp }}/api-pr.json
          API_JEST_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          API_JEST_BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.sha }}
          API_JEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          API_JEST_COMMAND: jest --runInBand --silent --detectOpenHandles --setupFilesAfterEnv=closeTestServers.cjs
          API_JEST_NPM_VERSION: 11.19.1
        run: |
          cd api
          ./node_modules/.bin/jest --runInBand --silent --detectOpenHandles \
            --setupFilesAfterEnv="${{ github.workspace }}/api/testSupport/closeTestServers.cjs" \
            --reporters=default \
            --reporters="${{ github.workspace }}/api/testSupport/apiBaselineReporter.cjs"
      - name: Check out preparation-base API for comparison
        if: always() && github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .baseline
      - name: Install preparation-base API dependencies
        if: always() && github.event_name == 'pull_request'
        run: npm ci --prefix .baseline/api
      - name: Complete preparation-base API test suite
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ci-test-key-not-valid
          NODE_ENV: test
          NODE_OPTIONS: --require=${{ github.workspace }}/api/testSupport/isolatedApiTestEnv.cjs --require=${{ github.workspace }}/api/testSupport/redirectAuditLogForTests.cjs
          API_JEST_RESULT_FILE: ${{ runner.temp }}/api-base.json
          API_JEST_SOURCE_COMMIT: ${{ github.event.pull_request.base.sha }}
          API_JEST_BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
          API_JEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          API_JEST_COMMAND: jest --runInBand --silent --detectOpenHandles --setupFilesAfterEnv=closeTestServers.cjs
          API_JEST_NPM_VERSION: 11.19.1
        run: |
          cd .baseline/api
          ./node_modules/.bin/jest --runInBand --silent --detectOpenHandles \
            --setupFilesAfterEnv="${{ github.workspace }}/api/testSupport/closeTestServers.cjs" \
            --reporters=default \
            --reporters="${{ github.workspace }}/api/testSupport/apiBaselineReporter.cjs"
      - name: Compare API failures against preparation baseline
        if: always() && github.event_name == 'pull_request'
        env:
          API_JEST_EXPECTED_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          API_JEST_EXPECTED_BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
          API_JEST_EXPECTED_PR_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: node scripts/compare-api-jest-baseline.cjs "$RUNNER_TEMP/api-base.json" "$RUNNER_TEMP/api-pr.json"
      - name: Frontend Jest tests
        if: always()
        run: npm --prefix ui test -- --runInBand --watchAll=false
      - name: Staging frontend build
        if: always()
        env:
          VERCEL_ENV: production
          VERCEL_GIT_COMMIT_REF: staging/unified-prep-2026-11-07
          VITE_API_ROUTING_MODE: same-origin
          VITE_SUPABASE_URL: https://jpemuoapbgzwapydqiio.supabase.co
          VITE_SUPABASE_ANON_KEY: synthetic-staging-anon-key-for-ci
        run: npm --prefix ui run build -- --outDir dist-staging
      - name: Scan staging asset endpoint configuration
        if: always()
        run: node scripts/check-staging-asset-endpoints.cjs ui/dist-staging ui/vercel.staging.json
      - name: Preview frontend build with staging Supabase
        if: always()
        env:
          VERCEL_ENV: preview
          VERCEL_GIT_COMMIT_REF: agent/phase6b-staging-security-remediation
          VITE_API_ROUTING_MODE: same-origin
          VITE_SUPABASE_URL: https://jpemuoapbgzwapydqiio.supabase.co
          VITE_SUPABASE_ANON_KEY: synthetic-staging-anon-key-for-ci
        run: npm --prefix ui run build -- --outDir dist-preview
      - name: Reject production Supabase configuration in preview build
        if: always()
        env:
          VERCEL_ENV: preview
          VERCEL_GIT_COMMIT_REF: agent/phase6b-staging-security-remediation
          VITE_API_ROUTING_MODE: same-origin
          VITE_SUPABASE_URL: https://production-test.supabase.co
          VITE_SUPABASE_ANON_KEY: synthetic-production-anon-key-for-ci
        run: |
          log_file="$RUNNER_TEMP/preview-production-supabase-build.log"
          if npm --prefix ui run build -- --outDir dist-preview-reject >"$log_file" 2>&1; then
            echo "Preview build unexpectedly accepted production Supabase configuration"
            cat "$log_file"
            exit 1
          fi
          if ! grep -Fq "Staging and preview builds require the approved staging Supabase project" "$log_file"; then
            echo "Preview build failed for an unexpected reason"
            cat "$log_file"
            exit 1
          fi
          echo "Preview build rejected production Supabase configuration as expected"
      - name: Production frontend build
        if: always()
        env:
          VERCEL_ENV: production
          VERCEL_GIT_COMMIT_REF: main
          VITE_API_ROUTING_MODE: same-origin
          VITE_SUPABASE_URL: https://production-test.supabase.co
          VITE_SUPABASE_ANON_KEY: synthetic-production-anon-key-for-ci
        run: npm --prefix ui run build -- --outDir dist-production
      - name: Scan production asset endpoint configuration
        if: always()
        run: node scripts/check-staging-asset-endpoints.cjs ui/dist-production ui/vercel.json
      - name: Backend syntax check
        if: always()
        run: node --check api/index.js
      - name: Migration 036 dependency check
        if: always()
        run: node scripts/check-migration-036-dependencies.cjs
      - name: Asset-preparation migration dependency and privilege check
        if: always()
        run: node scripts/check-staging-asset-privileges.cjs
